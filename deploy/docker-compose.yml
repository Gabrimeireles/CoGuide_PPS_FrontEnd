version: '3.9'

services:
  web:
    image: ${API_IMAGE:-ghcr.io/gabrimeireles/coguide-frontend}:${API_TAG:-latest}
    container_name: coguide-frontend
    restart: unless-stopped
    env_file:
      - .env.frontend
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-4000}:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'